name: '4-projects-apply'

on:
  push:
    branches:
      - production
    paths:
      - '4-projects/**'
      - '.github/workflows/4-projects-*.yaml'

permissions:
  contents: read
  id-token: write

env:
  STAGE: '4-projects'
  TF_VERSION: '1.3.0'

jobs:
  apply-shared:
    name: 'Apply - Shared Projects'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - id: 'auth'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_PROJECTS }}
          access_token_lifetime: '3600s'
      - name: Terraform Init
        working-directory: 4-projects/business_unit_1/shared
        run: terraform init
      - name: Terraform Apply
        working-directory: 4-projects/business_unit_1/shared
        run: terraform apply -auto-approve -input=false

  apply-development:
    name: 'Apply - Development Projects'
    runs-on: ubuntu-latest
    environment: production
    needs: apply-shared
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - id: 'auth'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_PROJECTS }}
          access_token_lifetime: '3600s'
      - name: Terraform Init
        working-directory: 4-projects/business_unit_1/development
        run: terraform init
      - name: Terraform Apply
        working-directory: 4-projects/business_unit_1/development
        run: terraform apply -auto-approve -input=false

  apply-nonproduction:
    name: 'Apply - Non-Production Projects'
    runs-on: ubuntu-latest
    environment: production
    needs: apply-development
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - id: 'auth'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_PROJECTS }}
          access_token_lifetime: '3600s'
      - name: Terraform Init
        working-directory: 4-projects/business_unit_1/nonproduction
        run: terraform init
      - name: Terraform Apply
        working-directory: 4-projects/business_unit_1/nonproduction
        run: terraform apply -auto-approve -input=false

  apply-production:
    name: 'Apply - Production Projects'
    runs-on: ubuntu-latest
    environment: production
    needs: apply-nonproduction
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - id: 'auth'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_PROJECTS }}
          access_token_lifetime: '3600s'
      - name: Terraform Init
        working-directory: 4-projects/business_unit_1/production
        run: terraform init
      - name: Terraform Apply
        working-directory: 4-projects/business_unit_1/production
        run: terraform apply -auto-approve -input=false
