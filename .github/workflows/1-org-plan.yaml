name: '1-org-plan'

on:
  pull_request:
    branches:
      - production
    paths:
      - '1-org/**'
      - 'policy-library/**'
      - '.github/workflows/1-org-*.yaml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  STAGE: '1-org'
  STAGE_DIR: '1-org/envs/shared'
  TF_VERSION: '1.3.0'

jobs:
  terraform-plan:
    name: 'Terraform Plan - Organization'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_ORG }}
          access_token_lifetime: '3600s'

      - name: Terraform Init
        working-directory: ${{ env.STAGE_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.STAGE_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.STAGE_DIR }}
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan_output.txt
        continue-on-error: true

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.STAGE_DIR }}/plan_output.txt', 'utf8');
            const output = `### Terraform Plan - Organization 🏢
            
            <details><summary>Show Plan</summary>
            
            \`\`\`terraform
            ${plan}
            \`\`\`
            
            </details>
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
