name: '3-networks-apply'

on:
  push:
    branches:
      - production
    paths:
      - '3-networks/**'
      - '.github/workflows/3-networks-*.yaml'

permissions:
  contents: read
  id-token: write

env:
  STAGE: '3-networks'
  TF_VERSION: '1.3.0'

jobs:
  apply-shared:
    name: 'Apply - Shared (DNS/Interconnect)'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - id: 'auth'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_NETWORKS }}
          access_token_lifetime: '3600s'
      - name: Terraform Init
        working-directory: 3-networks/envs/shared
        run: terraform init
      - name: Terraform Apply
        working-directory: 3-networks/envs/shared
        run: terraform apply -auto-approve -input=false

  apply-development:
    name: 'Apply - Development Networks'
    runs-on: ubuntu-latest
    environment: production
    needs: apply-shared
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - id: 'auth'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_NETWORKS }}
          access_token_lifetime: '3600s'
      - name: Terraform Init
        working-directory: 3-networks/envs/development
        run: terraform init
      - name: Terraform Apply
        working-directory: 3-networks/envs/development
        run: terraform apply -auto-approve -input=false

  apply-nonproduction:
    name: 'Apply - Non-Production Networks'
    runs-on: ubuntu-latest
    environment: production
    needs: apply-development
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - id: 'auth'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_NETWORKS }}
          access_token_lifetime: '3600s'
      - name: Terraform Init
        working-directory: 3-networks/envs/nonproduction
        run: terraform init
      - name: Terraform Apply
        working-directory: 3-networks/envs/nonproduction
        run: terraform apply -auto-approve -input=false

  apply-production:
    name: 'Apply - Production Networks'
    runs-on: ubuntu-latest
    environment: production
    needs: apply-nonproduction
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - id: 'auth'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_NETWORKS }}
          access_token_lifetime: '3600s'
      - name: Terraform Init
        working-directory: 3-networks/envs/production
        run: terraform init
      - name: Terraform Apply
        working-directory: 3-networks/envs/production
        run: terraform apply -auto-approve -input=false
