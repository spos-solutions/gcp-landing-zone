name: '3-networks'

on:
  pull_request:
    branches:
      - main
    paths:
      - '3-networks/**'
      - 'policy-library/**'
      - '.github/workflows/3-networks.yaml'
  push:
    branches:
      - main
    paths:
      - '3-networks/**'
      - 'policy-library/**'
      - '.github/workflows/3-networks.yaml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  STAGE: '3-networks'
  TF_VERSION: '1.3.0'

jobs:
  shared:
    name: 'Shared (DNS/Interconnect)'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || null }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/464376360315/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider'
          service_account: 'sa-terraform-bootstrap@prj-b-seed-spos.iam.gserviceaccount.com'
          access_token_lifetime: '3600s'

      - name: Terraform Init
        working-directory: 3-networks/envs/shared
        run: terraform init

      - name: Terraform Validate
        working-directory: 3-networks/envs/shared
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: 3-networks/envs/shared
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan_output.txt
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: OPA Policy Validation
        uses: ./.github/actions/opa-validate
        with:
          terraform-plan-file: 'tfplan'
          working-directory: '3-networks/envs/shared'
          policy-library-path: 'policy-library'
          fail-on-violation: 'true'

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('3-networks/envs/shared/plan_output.txt', 'utf8');
            const truncatedPlan = plan.length > 65000 ? plan.substring(0, 65000) + '\n\n... (truncated)' : plan;
            
            const output = `### 3-networks: Shared Environment 🌐
            
            <details><summary>Show Plan</summary>
            
            \`\`\`terraform
            ${truncatedPlan}
            \`\`\`
            
            </details>
            
            **Status:** ${{ steps.plan.outcome }}
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: 3-networks/envs/shared
        run: terraform apply -auto-approve -input=false tfplan

  development:
    name: 'Development Networks'
    runs-on: ubuntu-latest
    needs: shared
    environment: ${{ github.event_name == 'push' && 'production' || null }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/464376360315/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider'
          service_account: 'sa-terraform-bootstrap@prj-b-seed-spos.iam.gserviceaccount.com'
          access_token_lifetime: '3600s'

      - name: Terraform Init
        working-directory: 3-networks/envs/development
        run: terraform init

      - name: Terraform Validate
        working-directory: 3-networks/envs/development
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: 3-networks/envs/development
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan_output.txt
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: OPA Policy Validation
        uses: ./.github/actions/opa-validate
        with:
          terraform-plan-file: 'tfplan'
          working-directory: '3-networks/envs/development'
          policy-library-path: 'policy-library'
          fail-on-violation: 'true'

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: 3-networks/envs/development
        run: terraform apply -auto-approve -input=false tfplan

  nonproduction:
    name: 'Non-Production Networks'
    runs-on: ubuntu-latest
    needs: development
    environment: ${{ github.event_name == 'push' && 'production' || null }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/464376360315/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider'
          service_account: 'sa-terraform-bootstrap@prj-b-seed-spos.iam.gserviceaccount.com'
          access_token_lifetime: '3600s'

      - name: Terraform Init
        working-directory: 3-networks/envs/nonproduction
        run: terraform init

      - name: Terraform Validate
        working-directory: 3-networks/envs/nonproduction
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: 3-networks/envs/nonproduction
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan_output.txt
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: OPA Policy Validation
        uses: ./.github/actions/opa-validate
        with:
          terraform-plan-file: 'tfplan'
          working-directory: '3-networks/envs/nonproduction'
          policy-library-path: 'policy-library'
          fail-on-violation: 'true'

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: 3-networks/envs/nonproduction
        run: terraform apply -auto-approve -input=false tfplan

  production:
    name: 'Production Networks'
    runs-on: ubuntu-latest
    needs: nonproduction
    environment: ${{ github.event_name == 'push' && 'production' || null }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/464376360315/locations/global/workloadIdentityPools/foundation-pool/providers/foundation-gh-provider'
          service_account: 'sa-terraform-bootstrap@prj-b-seed-spos.iam.gserviceaccount.com'
          access_token_lifetime: '3600s'

      - name: Terraform Init
        working-directory: 3-networks/envs/production
        run: terraform init

      - name: Terraform Validate
        working-directory: 3-networks/envs/production
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: 3-networks/envs/production
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan_output.txt
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: OPA Policy Validation
        uses: ./.github/actions/opa-validate
        with:
          terraform-plan-file: 'tfplan'
          working-directory: '3-networks/envs/production'
          policy-library-path: 'policy-library'
          fail-on-violation: 'true'

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: 3-networks/envs/production
        run: terraform apply -auto-approve -input=false tfplan
