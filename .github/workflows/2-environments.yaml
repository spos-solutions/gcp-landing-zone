name: '2-environments'

on:
  pull_request:
    branches:
      - main
    paths:
      - '2-environments/**'
      - 'policy-library/**'
      - '.github/workflows/2-environments.yaml'
  push:
    branches:
      - main
    paths:
      - '2-environments/**'
      - 'policy-library/**'
      - '.github/workflows/2-environments.yaml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  STAGE: '2-environments'
  TF_VERSION: '1.3.0'

jobs:
  development:
    name: 'Development Environment'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || null }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_ENVIRONMENTS }}
          access_token_lifetime: '3600s'

      - name: Terraform Init
        working-directory: 2-environments/envs/development
        run: terraform init

      - name: Terraform Validate
        working-directory: 2-environments/envs/development
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: 2-environments/envs/development
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan_output.txt
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: OPA Policy Validation
        uses: ./.github/actions/opa-validate
        with:
          terraform-plan-file: 'tfplan'
          working-directory: '2-environments/envs/development'
          policy-library-path: 'policy-library'
          fail-on-violation: 'true'

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: 2-environments/envs/development
        run: terraform apply -auto-approve -input=false tfplan

  nonproduction:
    name: 'Non-Production Environment'
    runs-on: ubuntu-latest
    needs: development
    environment: ${{ github.event_name == 'push' && 'production' || null }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_ENVIRONMENTS }}
          access_token_lifetime: '3600s'

      - name: Terraform Init
        working-directory: 2-environments/envs/nonproduction
        run: terraform init

      - name: Terraform Validate
        working-directory: 2-environments/envs/nonproduction
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: 2-environments/envs/nonproduction
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan_output.txt
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: OPA Policy Validation
        uses: ./.github/actions/opa-validate
        with:
          terraform-plan-file: 'tfplan'
          working-directory: '2-environments/envs/nonproduction'
          policy-library-path: 'policy-library'
          fail-on-violation: 'true'

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: 2-environments/envs/nonproduction
        run: terraform apply -auto-approve -input=false tfplan

  production:
    name: 'Production Environment'
    runs-on: ubuntu-latest
    needs: nonproduction
    environment: ${{ github.event_name == 'push' && 'production' || null }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_ENVIRONMENTS }}
          access_token_lifetime: '3600s'

      - name: Terraform Init
        working-directory: 2-environments/envs/production
        run: terraform init

      - name: Terraform Validate
        working-directory: 2-environments/envs/production
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: 2-environments/envs/production
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan_output.txt
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: OPA Policy Validation
        uses: ./.github/actions/opa-validate
        with:
          terraform-plan-file: 'tfplan'
          working-directory: '2-environments/envs/production'
          policy-library-path: 'policy-library'
          fail-on-violation: 'true'

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: 2-environments/envs/production
        run: terraform apply -auto-approve -input=false tfplan
