name: '2-environments-plan'

on:
  pull_request:
    branches:
      - production
    paths:
      - '2-environments/**'
      - '.github/workflows/2-environments-*.yaml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  STAGE: '2-environments'
  TF_VERSION: '1.3.0'

jobs:
  plan-development:
    name: 'Plan - Development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - id: 'auth'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_ENVIRONMENTS }}
          access_token_lifetime: '3600s'
      - name: Terraform Init
        working-directory: 2-environments/envs/development
        run: terraform init
      - name: Terraform Plan
        working-directory: 2-environments/envs/development
        run: terraform plan -input=false -out=tfplan

  plan-nonproduction:
    name: 'Plan - Non-Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - id: 'auth'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_ENVIRONMENTS }}
          access_token_lifetime: '3600s'
      - name: Terraform Init
        working-directory: 2-environments/envs/nonproduction
        run: terraform init
      - name: Terraform Plan
        working-directory: 2-environments/envs/nonproduction
        run: terraform plan -input=false -out=tfplan

  plan-production:
    name: 'Plan - Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - id: 'auth'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_ENVIRONMENTS }}
          access_token_lifetime: '3600s'
      - name: Terraform Init
        working-directory: 2-environments/envs/production
        run: terraform init
      - name: Terraform Plan
        working-directory: 2-environments/envs/production
        run: terraform plan -input=false -out=tfplan
