name: '1-org'

on:
  pull_request:
    branches:
      - main
    paths:
      - '1-org/**'
      - 'policy-library/**'
      - '.github/workflows/1-org.yaml'
  push:
    branches:
      - main
    paths:
      - '1-org/**'
      - 'policy-library/**'
      - '.github/workflows/1-org.yaml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  STAGE: '1-org'
  STAGE_DIR: '1-org/envs/shared'
  TF_VERSION: '1.3.0'

jobs:
  terraform:
    name: 'Organization Setup'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || null }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_NAME }}
          service_account: ${{ secrets.TF_SA_ORG }}
          access_token_lifetime: '3600s'

      - name: Terraform Init
        working-directory: ${{ env.STAGE_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.STAGE_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.STAGE_DIR }}
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan > plan_output.txt
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: OPA Policy Validation
        uses: ./.github/actions/opa-validate
        with:
          terraform-plan-file: 'tfplan'
          working-directory: ${{ env.STAGE_DIR }}
          policy-library-path: 'policy-library'
          fail-on-violation: 'true'

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.STAGE_DIR }}/plan_output.txt', 'utf8');
            const truncatedPlan = plan.length > 65000 ? plan.substring(0, 65000) + '\n\n... (truncated)' : plan;
            
            const output = `### Terraform Plan - Organization 🏢
            
            <details><summary>Show Plan</summary>
            
            \`\`\`terraform
            ${truncatedPlan}
            \`\`\`
            
            </details>
            
            **Status:** ${{ steps.plan.outcome }}
            
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.STAGE_DIR }}
        run: terraform apply -auto-approve -input=false tfplan
